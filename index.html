<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Inkwell — Notizen & Scans</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ===================== LIBRARY VIEW ===================== -->
  <section id="library" class="view active">
    <header class="lib-header">
      <div class="brand">
        <div class="brand-mark">✦</div>
        <div>
          <h1>Inkwell</h1>
          <p class="brand-sub">Deine Notizbücher & Scans</p>
        </div>
      </div>
      <div class="lib-actions">
        <button id="btn-scan-lib" class="btn ghost">
          <span class="ic">⛶</span> Scannen
        </button>
        <button id="btn-new" class="btn primary">
          <span class="ic">＋</span> Neues Notizbuch
        </button>
      </div>
    </header>

    <div class="lib-toolbar">
      <input id="search" type="search" placeholder="Notizbücher durchsuchen…" />
      <div class="seg" id="sort-seg">
        <button data-sort="updated" class="active">Zuletzt</button>
        <button data-sort="name">Name</button>
        <button data-sort="created">Erstellt</button>
      </div>
    </div>

    <main id="grid" class="grid"></main>
    <div id="empty-state" class="empty hidden">
      <div class="empty-art">📒</div>
      <h2>Noch keine Notizbücher</h2>
      <p>Erstelle dein erstes Notizbuch oder scanne ein Dokument.</p>
      <button class="btn primary" onclick="document.getElementById('btn-new').click()">Jetzt starten</button>
    </div>
  </section>

  <!-- ===================== EDITOR VIEW ===================== -->
  <section id="editor" class="view">
    <header class="ed-top">
      <button id="btn-back" class="icon-btn" title="Zurück">‹</button>
      <input id="doc-title" class="doc-title" value="Notizbuch" />
      <div class="spacer"></div>
      <button id="btn-undo" class="icon-btn" title="Rückgängig" disabled>↶</button>
      <button id="btn-redo" class="icon-btn" title="Wiederholen" disabled>↷</button>
      <div class="page-pill">
        <button id="btn-prev-page" class="icon-btn sm" title="Vorherige Seite">‹</button>
        <span id="page-indicator">1 / 1</span>
        <button id="btn-next-page" class="icon-btn sm" title="Nächste Seite">›</button>
      </div>
      <button id="btn-add-page" class="icon-btn" title="Seite hinzufügen">＋</button>
      <button id="btn-scan-ed" class="icon-btn" title="Dokument scannen">⛶</button>
      <button id="btn-export" class="icon-btn" title="Exportieren">⇪</button>
      <button id="btn-menu" class="icon-btn" title="Mehr">⋯</button>
    </header>

    <div class="ed-body">
      <!-- Tool dock -->
      <div class="dock" id="dock">
        <div class="tool-group">
          <button class="tool" data-tool="fountain" title="Füller">
            <span class="tool-ic">🖋️</span><span class="tool-lbl">Füller</span>
          </button>
          <button class="tool" data-tool="ballpoint" title="Kugelschreiber">
            <span class="tool-ic">🖊️</span><span class="tool-lbl">Kugel</span>
          </button>
          <button class="tool" data-tool="pencil" title="Bleistift">
            <span class="tool-ic">✏️</span><span class="tool-lbl">Bleistift</span>
          </button>
          <button class="tool" data-tool="highlighter" title="Textmarker">
            <span class="tool-ic">🖍️</span><span class="tool-lbl">Marker</span>
          </button>
          <button class="tool" data-tool="eraser" title="Radierer">
            <span class="tool-ic">🩹</span><span class="tool-lbl">Radierer</span>
          </button>
          <button class="tool" data-tool="lasso" title="Auswahl/Verschieben">
            <span class="tool-ic">⌖</span><span class="tool-lbl">Lasso</span>
          </button>
          <button class="tool" data-tool="hand" title="Verschieben/Zoom">
            <span class="tool-ic">✋</span><span class="tool-lbl">Hand</span>
          </button>
        </div>

        <div class="dock-divider"></div>

        <div class="size-group" id="size-group">
          <button class="size-dot" data-size="1.5"><i style="width:3px;height:3px"></i></button>
          <button class="size-dot" data-size="3"><i style="width:6px;height:6px"></i></button>
          <button class="size-dot active" data-size="5"><i style="width:9px;height:9px"></i></button>
          <button class="size-dot" data-size="9"><i style="width:14px;height:14px"></i></button>
          <button class="size-dot" data-size="16"><i style="width:20px;height:20px"></i></button>
        </div>

        <div class="dock-divider"></div>

        <div class="color-group" id="color-group"></div>
        <label class="custom-color" title="Eigene Farbe">
          <input type="color" id="custom-color" value="#1f6feb" />
          <span>＋</span>
        </label>
      </div>

      <!-- Canvas stage -->
      <div class="stage" id="stage">
        <div class="canvas-wrap" id="canvas-wrap">
          <canvas id="paper" class="paper-layer"></canvas>
          <canvas id="ink" class="ink-layer"></canvas>
          <canvas id="live" class="live-layer"></canvas>
        </div>
        <div class="zoom-pill">
          <button id="zoom-out" class="icon-btn sm">－</button>
          <span id="zoom-label">100%</span>
          <button id="zoom-in" class="icon-btn sm">＋</button>
          <button id="zoom-fit" class="icon-btn sm" title="Einpassen">⤢</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== MODALS ===================== -->
  <div id="modal-root"></div>

  <!-- Scanner overlay -->
  <div id="scanner" class="scanner hidden">
    <video id="cam" playsinline autoplay muted></video>
    <canvas id="scan-canvas" class="hidden"></canvas>
    <div class="scan-ui">
      <div class="scan-top">
        <button id="scan-close" class="icon-btn light">✕</button>
        <span class="scan-hint">Dokument im Rahmen ausrichten</span>
        <button id="scan-flip" class="icon-btn light" title="Kamera wechseln">⟲</button>
      </div>
      <div class="scan-frame"></div>
      <div class="scan-bottom">
        <div class="filter-seg" id="filter-seg">
          <button data-filter="color" class="active">Farbe</button>
          <button data-filter="gray">Graustufen</button>
          <button data-filter="bw">S/W Dokument</button>
        </div>
        <button id="scan-shoot" class="shutter"></button>
      </div>
    </div>
    <!-- Review screen after capture -->
    <div id="scan-review" class="scan-review hidden">
      <img id="scan-preview" alt="Scan-Vorschau" />
      <div class="scan-review-actions">
        <button id="scan-retake" class="btn ghost light">Neu</button>
        <button id="scan-use" class="btn primary">Verwenden</button>
      </div>
    </div>
  </div>

  <input id="img-import" type="file" accept="image/*" class="hidden" />

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
